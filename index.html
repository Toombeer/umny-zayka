  --c-pink: #D92E7F; --c-pink-s: #FFE5F1;
  --c-amber: #B86A00; --c-amber-s: #FFF0D3;

    --grad: linear-gradient(135deg, #B9A2FF, #9272F7);
    --hero-a: #5A32CC; --hero-b: #8E2FB0;
    --c-violet: #B79EFF; --c-violet-s: #2C2356; --c-blue: #7DB0FF; --c-blue-s: #172B52;

* { box-sizing: border-box; }

.side .note { margin-top: 14px; font-size: 12px; color: var(--muted); padding: 0 4px; }
.mtop { display: none; }
main { min-width: 0; }

.stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.av { width: 38px; height: 38px; border-radius: 12px; background: var(--s); color: var(--c); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.dir { display: inline-block; font-size: 12px; font-weight: 600; background: var(--s); color: var(--c); border-radius: 99px; padding: 1px 9px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.p-good { background: var(--good-bg); color: var(--good); } .p-warn { background: var(--warn-bg); color: var(--warn); }
.p-bad { background: var(--bad-bg); color: var(--bad); } .p-mute { background: var(--surface2); color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px; font-weight: 600; }
.btn:hover { border-color: var(--accent); color: var(--accent); }

.week { display: grid; gap: 14px; }

.kan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

.ov { position: fixed; inset: 0; background: rgba(15,10,40,.55); display: flex; justify-content: flex-end; z-index: 20; }
.panel { background: var(--surface); width: min(540px, 100%); height: 100%; overflow-y: auto; padding: calc(22px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 28px 22px; }
.panel header { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 16px; }

.st .s-was[aria-pressed="true"] { background: var(--good-bg); color: var(--good); }
.st .s-late[aria-pressed="true"] { background: var(--warn-bg); color: var(--warn); }
.st .s-absent[aria-pressed="true"] { background: var(--bad-bg); color: var(--bad); }
.st .s-excused[aria-pressed="true"] { background: var(--c-blue-s); color: var(--c-blue); }
textarea { width: 100%; min-height: 64px; resize: vertical; }
form { display: grid; gap: 12px; }
form label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 500; }
.preview { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 14px; }

.ex { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); border-radius: 99px; padding: 1px 8px; vertical-align: middle; margin-left: 6px; }
@media (max-width: 800px) {

</style>

function spark(h, color) {
  const v = h.map(x => x[1]), mn = Math.min(...v), mx = Math.max(...v), w = 120, ht = 34, pad = 4;

  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${ht}" width="${w}" height="${ht}" aria-hidden="true"><polyline points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" style="stroke:${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" style="fill:${color}"/></svg>`;
}

function updateCalc() {
  const n = +$('#c-n').value || 0, p = +$('#c-p').value || 0, k = +$('#c-k').value || 1, m = $('#c-m').value;
  const d = Math.min(100, Math.max(0, +$('#c-d').value || 0)), base = n * p;
  let fam = 0; for (let i = 0; i < k; i++) fam += base * (i === 0 ? 1 : i === 1 ? .9 : .85);
  const sib = base * k - fam, ex = fam * d / 100, total = fam - ex, cnt = n * k;
  $('#c-rl').hidden = m !== 'cash';
  const rvRaw = $('#c-r').value, rv = rvRaw === '' ? null : +rvRaw;
  $('#calcOut').innerHTML = `<h2>Итог</h2>
    <div class="row"><div class="grow">Стоимость без скидок (${k} × ${n} зан.)</div><b>${money(base * k)}</b></div>

function curChange(c) {
  const h = RHIST[c]; if (!h || h.length < 2) return null;
  const cur = h[h.length - 1][1], prev = h[h.length - 2][1], first = h[0][1];
  return {cur, prev, prevDate: h[h.length - 2][0], d: cur - prev, p: (cur - prev) / prev * 100, firstDate: h[0][0], all: (cur - first) / first * 100, h};
}

    const left = remainOf(pd.fid); let msg = 'Принято ' + money(a);
    if (pd.method === 'cash' && recv > a) msg += ', сдача ' + money(recv - a);
    if (left === 0) { kids.filter(k => k.fid === pd.fid).forEach(k => { k.left += PACK; k.status = 'active'; }); families[pd.fid].debt = false; msg += '. Счёт закрыт, абонемент продлён'; }
    else msg += '. Осталось ' + money(left);
    closeM(); render(); toast(msg);
  } else if (fid === 'itf') {
    const link = $('#it-link').value.trim();
    if (link && !link.startsWith('https://')) { toast('Ссылка должна начинаться с https://'); return; }
    items.unshift({id: nextId++, name: $('#it-name').value.trim(), unit: $('#it-unit').value.trim() || 'шт.', target: +$('#it-target').value || 0, link, h: [[TODAY, +$('#it-price').value]]});
    render(); toast('Товар добавлен в список');
  } else if (fid === 'ipf') {
    const it = items.find(x => x.id === priceEdit), v = +$('#ip-price').value, prev = curP(it);
    if (it.h[it.h.length - 1][0] === TODAY) it.h[it.h.length - 1][1] = v; else it.h.push([TODAY, v]);
    closeM(); render(); toast(v === prev ? 'Цена не изменилась' : (v > prev ? 'Подорожало на ' : 'Подешевело на ') + Math.abs((v - prev) / prev * 100).toFixed(1).replace('.', ',') + '%');
  } else if (fid === 'kcf') {
    kaspi = {on: true, bin: $('#kc-bin').value, point: $('#kc-point').value.trim()};
    closeM(); render(); toast('Kaspi Pay подключён (пример)');
  }
});
/* ---------- сохранение на устройстве ---------- */
let resetArm = false;
function saveState() { try { localStorage.setItem('zstate', JSON.stringify({v: 1, kids, leads, families, revenue, nextId, att, payments, items, kaspi})); } catch (e) {} }
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('zstate') || 'null');
    if (!s || s.v !== 1) return;
    kids = s.kids; leads = s.leads; revenue = s.revenue; nextId = s.nextId; payments = s.payments; items = s.items; kaspi = s.kaspi;
    Object.keys(families).forEach(k => delete families[k]); Object.assign(families, s.families); Object.assign(att, s.att);
  } catch (e) {}
}
loadState();
render();
</script>

<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
